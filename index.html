            function getMapInstance() {
                for (var key in window) {
                    if (window[key] && typeof window[key].setView === 'function' && typeof window[key].flyTo === 'function') {
                        return window[key];
                    }
                }
                return null;
            }

            function toggleSidebar(show) {
                document.getElementById('custom-sidebar').style.display = show ? 'flex' : 'none';
                document.getElementById('show-sidebar-btn').style.display = show ? 'none' : 'block';

                // --- НОВАЯ ЛОГИКА: ПРЯЧЕМ СЛОИ (СХЕМА/ГИБРИД) ПРИ ОТКРЫТОМ МЕНЮ НА ТЕЛЕФОНЕ ---
                let layerControl = document.querySelector('.leaflet-control-layers');
                if (layerControl) {
                    if (show && window.innerWidth <= 768) {
                        layerControl.style.display = 'none'; // Скрываем
                    } else {
                        layerControl.style.display = ''; // Возвращаем
                    }
                }
            }

            function renderSidebar(filterText = "") {
                const container = document.getElementById('store-list-container');
                container.innerHTML = "";
                
                let groups = {};
                storesData.forEach(s => {
                    if(s.name.toLowerCase().includes(filterText) || s.eng.toLowerCase().includes(filterText)) {
                        if(!groups[s.eng]) groups[s.eng] = {color: s.color, stores: []};
                        groups[s.eng].stores.push(s);
                    }
                });

                for (const eng in groups) {
                    let g = groups[eng];
                    let details = document.createElement('details');
                    if (filterText !== "") details.open = true; 
                    
                    let summary = document.createElement('summary');
                    summary.className = 'eng-title';
                    summary.style.borderLeftColor = g.color;
                    summary.innerHTML = `<span>${eng}</span><span style="color:gray; font-size:11px;">(${g.stores.length})</span>`;
                    details.appendChild(summary);

                    g.stores.forEach(s => {
                        let div = document.createElement('div');
                        div.className = 'store-item';
                        div.innerText = s.name;
                        div.onclick = () => {
                            let m = getMapInstance();
                            if (m) {
                                m.setView([s.lat, s.lon], 18);
                            }
                            if (window.innerWidth <= 768) {
                                toggleSidebar(false);
                            }
                        };
                        details.appendChild(div);
                    });
                    
                    let groupDiv = document.createElement('div');
                    groupDiv.className = 'eng-group';
                    groupDiv.appendChild(details);
                    container.appendChild(groupDiv);
                }
            }

            function filterStores() {
                let text = document.getElementById('search-box').value.toLowerCase();
                renderSidebar(text);
            }
            
            setTimeout(() => { 
                renderSidebar(); 
                if (window.innerWidth <= 768) {
                    toggleSidebar(false); 
                }
            }, 300);
