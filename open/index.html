<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRD Logistics - Трекер открытий и ТО</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Плавные переходы */
        .transition-all { transition: all 0.3s ease; }
        dialog::backdrop { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(3px); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Навигация -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="text-xl font-bold flex items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Панель управления ИТ
        </div>
        <div id="auth-section" class="flex items-center gap-4">
            <span id="user-info" class="hidden text-sm text-blue-200"></span>
            <button id="btn-login-modal" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded text-sm transition-all">Вход для админа</button>
            <button id="btn-logout" class="hidden bg-red-600 hover:bg-red-500 px-4 py-2 rounded text-sm transition-all">Выйти</button>
        </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- ЛЕВАЯ КОЛОНКА: ТО -->
        <section class="lg:col-span-1 bg-white rounded-lg shadow p-5 border-t-4 border-blue-500 h-fit">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">ТО на <span id="current-month" class="capitalize text-blue-600"></span></h2>
                <button id="btn-add-to" class="hidden bg-green-500 text-white px-2 py-1 rounded text-sm hover:bg-green-600">+</button>
            </div>
            <div id="to-list" class="flex flex-col gap-2">
                <!-- Загрузка ТО -->
                <p class="text-gray-400 text-sm">Загрузка данных...</p>
            </div>
        </section>

        <!-- ПРАВАЯ КОЛОНКА: Открытия -->
        <section class="lg:col-span-2 bg-white rounded-lg shadow p-5 border-t-4 border-purple-500">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-700">Открытия магазинов</h2>
                <button id="btn-add-open" class="hidden bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600">Добавить открытие</button>
            </div>
            <div id="openings-list" class="grid grid-cols-1 gap-6">
                 <!-- Загрузка открытий -->
            </div>
        </section>
    </main>

    <!-- Модальное окно авторизации -->
    <dialog id="login-modal" class="p-6 rounded-lg shadow-xl border-0 w-96">
        <h3 class="text-lg font-bold mb-4">Вход в панель</h3>
        <input type="text" id="login-username" placeholder="Логин (например, docenko_n_v)" class="w-full border p-2 rounded mb-3">
        <input type="password" id="login-password" placeholder="Пароль" class="w-full border p-2 rounded mb-4">
        <div class="flex justify-end gap-2">
            <button onclick="document.getElementById('login-modal').close()" class="px-4 py-2 text-gray-500">Отмена</button>
            <button id="btn-submit-login" class="px-4 py-2 bg-blue-600 text-white rounded">Войти</button>
        </div>
    </dialog>

    <!-- Модальное окно добавления ТО -->
    <dialog id="modal-add-to" class="p-6 rounded-lg shadow-xl border-0 w-96">
        <h3 class="text-lg font-bold mb-4">Добавить магазин на ТО</h3>
        <input type="text" id="new-to-name" placeholder="Номер/Название магазина" class="w-full border p-2 rounded mb-4">
        <div class="flex justify-end gap-2">
            <button onclick="document.getElementById('modal-add-to').close()" class="px-4 py-2 text-gray-500">Отмена</button>
            <button id="btn-save-to" class="px-4 py-2 bg-green-600 text-white rounded">Добавить</button>
        </div>
    </dialog>

    <!-- Модальное окно добавления Открытия -->
    <dialog id="modal-add-open" class="p-6 rounded-lg shadow-xl border-0 w-[500px] max-w-full">
        <h3 class="text-lg font-bold mb-4">Новое открытие</h3>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <input type="text" id="op-name" placeholder="Название магазина" class="col-span-2 border p-2 rounded">
            <input type="date" id="op-date" class="border p-2 rounded">
            <input type="text" id="op-address" placeholder="Адрес" class="border p-2 rounded">
            <input type="text" id="op-resp" placeholder="Ответственный" class="border p-2 rounded">
            <input type="text" id="op-fact" placeholder="Кто собирает (по факту)" class="border p-2 rounded">
        </div>
        <div class="flex justify-end gap-2 mt-4">
            <button onclick="document.getElementById('modal-add-open').close()" class="px-4 py-2 text-gray-500">Отмена</button>
            <button id="btn-save-open" class="px-4 py-2 bg-purple-600 text-white rounded">Создать карточку</button>
        </div>
    </dialog>

    <!-- Скрипты Firebase и логика -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyCX2CTvfJMLdhVYIuEfY8sgPWawvaU8DYI",
            authDomain: "krd-tracker.firebaseapp.com",
            projectId: "krd-tracker",
            storageBucket: "krd-tracker.firebasestorage.app",
            messagingSenderId: "506382681336",
            appId: "1:506382681336:web:e093bf1daba1656685270d",
            measurementId: "G-2ET577W13G"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isAdmin = false;

        // Настройка текущего месяца
        const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
        document.getElementById('current-month').innerText = months[new Date().getMonth()];

        // Этапы сборки
        const stepsConfig = [
            { id: "pkd", label: "ПКД (заливка/настройка)" },
            { id: "server", label: "Сервер (заливка/настройка)" },
            { id: "routerRes", label: "Роутер Резерв" },
            { id: "routerMas", label: "Роутер Мастер" },
            { id: "sverka", label: "Сверка сервера" },
            { id: "kkm", label: "Регистрация ККМ" },
            { id: "tbo", label: "Регистрация ТБО (Пинпады)" },
            { id: "egais", label: "Выпуск ключа ЕГАИС" },
            { id: "uks", label: "Сборка УКС" },
            { id: "kassa", label: "Сборка касс" },
            { id: "kso", label: "Сборка КСО" },
            { id: "ap", label: "Установка точек доступа (ТД)" }
        ];

        // --- АВТОРИЗАЦИЯ ---
        onAuthStateChanged(auth, (user) => {
            isAdmin = !!user;
            document.getElementById('btn-login-modal').classList.toggle('hidden', isAdmin);
            document.getElementById('btn-logout').classList.toggle('hidden', !isAdmin);
            document.getElementById('user-info').classList.toggle('hidden', !isAdmin);
            document.getElementById('btn-add-to').classList.toggle('hidden', !isAdmin);
            document.getElementById('btn-add-open').classList.toggle('hidden', !isAdmin);
            
            if(user) document.getElementById('user-info').innerText = user.email.split('@')[0];
            renderUI(); // Перерисовать UI с учетом прав
        });

        document.getElementById('btn-login-modal').onclick = () => document.getElementById('login-modal').showModal();
        
        document.getElementById('btn-submit-login').onclick = async () => {
            const u = document.getElementById('login-username').value + "@krd.ru";
            const p = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, u, p);
                document.getElementById('login-modal').close();
            } catch (error) {
                alert("Ошибка входа: проверьте логин и пароль");
            }
        };

        document.getElementById('btn-logout').onclick = () => signOut(auth);

        // --- ДАННЫЕ И РЕНДЕР ---
        let toData = [];
        let openingsData = [];

        // Слушатель ТО
        onSnapshot(query(collection(db, "maintenance"), orderBy("createdAt", "asc")), (snapshot) => {
            toData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderUI();
        });

        // Слушатель Открытий
        onSnapshot(query(collection(db, "openings"), orderBy("date", "asc")), (snapshot) => {
            openingsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderUI();
        });

        function renderUI() {
            // Рендер ТО
            const toList = document.getElementById('to-list');
            toList.innerHTML = toData.map(item => `
                <div class="flex items-center p-3 rounded border ${item.done ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} transition-all">
                    <input type="checkbox" ${item.done ? 'checked' : ''} ${!isAdmin ? 'disabled' : ''} 
                        class="w-5 h-5 mr-3 cursor-pointer" 
                        onchange="window.updateTO('${item.id}', this.checked)">
                    <span class="font-medium ${item.done ? 'line-through text-gray-500' : 'text-red-700'}">${item.name}</span>
                </div>
            `).join('') || '<p class="text-gray-400 text-sm">Нет задач на этот месяц</p>';

            // Рендер Открытий
            const opList = document.getElementById('openings-list');
            opList.innerHTML = openingsData.map(shop => `
                <div class="border rounded-lg p-5 bg-gray-50 shadow-sm relative">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 pb-4 border-b">
                        <div>
                            <h3 class="text-xl font-bold text-purple-700">${shop.name}</h3>
                            <p class="text-sm text-gray-600">📍 ${shop.address}</p>
                            <p class="text-sm font-semibold mt-1">📅 Открытие: ${new Date(shop.date).toLocaleDateString('ru-RU')}</p>
                        </div>
                        <div class="text-sm bg-white p-3 rounded border">
                            <p><span class="text-gray-500">Ответственный:</span> <b>${shop.responsible}</b></p>
                            <p><span class="text-gray-500">Собирает по факту:</span> <b class="text-blue-600">${shop.actualAssembler || '---'}</b></p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        ${stepsConfig.map(step => `
                            <label class="flex items-center space-x-2 text-sm cursor-pointer p-2 rounded hover:bg-gray-100 transition-all ${shop.tasks?.[step.id] ? 'bg-green-100 text-green-800' : 'bg-white border'}">
                                <input type="checkbox" ${shop.tasks?.[step.id] ? 'checked' : ''} ${!isAdmin ? 'disabled' : ''} 
                                    onchange="window.updateStep('${shop.id}', '${step.id}', this.checked)"
                                    class="w-4 h-4 rounded text-purple-600">
                                <span>${step.label}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('') || '<p class="text-gray-400 text-sm">Нет запланированных открытий</p>';
        }

        // Глобальные функции для чекбоксов
        window.updateTO = async (id, isDone) => {
            if(!isAdmin) return;
            await updateDoc(doc(db, "maintenance", id), { done: isDone });
        };

        window.updateStep = async (shopId, stepId, isChecked) => {
            if(!isAdmin) return;
            await updateDoc(doc(db, "openings", shopId), { 
                [`tasks.${stepId}`]: isChecked 
            });
        };

        // --- ДОБАВЛЕНИЕ НОВЫХ ЗАПИСЕЙ ---
        document.getElementById('btn-add-to').onclick = () => document.getElementById('modal-add-to').showModal();
        document.getElementById('btn-save-to').onclick = async () => {
            const name = document.getElementById('new-to-name').value;
            if(!name) return;
            await addDoc(collection(db, "maintenance"), { name, done: false, createdAt: serverTimestamp() });
            document.getElementById('new-to-name').value = '';
            document.getElementById('modal-add-to').close();
        };

        document.getElementById('btn-add-open').onclick = () => document.getElementById('modal-add-open').showModal();
        document.getElementById('btn-save-open').onclick = async () => {
            const data = {
                name: document.getElementById('op-name').value,
                date: document.getElementById('op-date').value,
                address: document.getElementById('op-address').value,
                responsible: document.getElementById('op-resp').value,
                actualAssembler: document.getElementById('op-fact').value,
                tasks: {},
                createdAt: serverTimestamp()
            };
            if(!data.name || !data.date) return alert('Введите хотя бы название и дату');
            
            await addDoc(collection(db, "openings"), data);
            document.getElementById('modal-add-open').close();
            // Очистка полей
            ['op-name','op-date','op-address','op-resp','op-fact'].forEach(id => document.getElementById(id).value = '');
        };
    </script>
</body>
</html>
