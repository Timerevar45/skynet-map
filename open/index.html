<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КРД · Открытия и ТО</title>
<style>
:root{--bg:#0d1117;--p:#161b22;--p2:#1c232c;--ink:#e6edf3;--mute:#8b98a5;--line:#2a323c;--acc:#f0a30a;--ok:#3fb950;--bad:#f85149;--okbg:#12261a;--badbg:#2d1517}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px}.logo b{color:var(--acc)}
.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--p2);color:var(--ink);border-radius:6px;padding:7px 13px}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pri{background:var(--acc);border-color:var(--acc);color:#1a1200;font-weight:700}
.dng{color:var(--bad)}
.who{color:var(--mute);font-size:13px}
.month{display:flex;align-items:center;gap:6px}
.month span{min-width:150px;text-align:center;font-size:17px;font-weight:700;text-transform:capitalize}
.wrap{max-width:1500px;margin:0 auto;padding:20px 24px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.kpi{grid-template-columns:repeat(2,1fr)}}
.k{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;align-items:center;gap:14px}
.ring{--v:0;--c:var(--ok);width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0)}
.ring i{width:56px;height:56px;border-radius:50%;background:var(--p);display:grid;place-items:center;font:700 17px/1 "Segoe UI",sans-serif;font-style:normal}
.big{font-size:38px;font-weight:800;line-height:1;width:74px;text-align:center;flex:none}
.k h4{margin:0;font-size:13px;color:var(--mute);font-weight:600}
.k p{margin:3px 0 0;font-size:15px;font-weight:600}
.cols{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.side{display:grid;gap:18px}
section{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h2{margin:0;font-size:15px;font-weight:700}
.cnt{color:var(--mute);font-size:13px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.to{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:6px;border-radius:6px;background:var(--badbg);border-left:4px solid var(--bad)}
.to.done{background:var(--okbg);border-left-color:var(--ok)}
.to .n{flex:1}.to.done .n{color:var(--mute);text-decoration:line-through}
.to em{font-style:normal;font-size:12px;font-weight:700;color:var(--bad)}.to.done em{color:var(--ok)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--ok);flex:none}
input[disabled]{opacity:1}
.add{display:none;gap:8px;margin-top:12px}body.admin .add{display:flex}
input[type=text],input[type=date],input[type=password]{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.st{display:grid;grid-template-columns:1fr 46px;gap:2px 10px;margin-top:9px;font-size:13px}
.st .bar{grid-column:1/-1;height:5px}.st b{text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--p2);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:10px;padding:14px}
.card.over{border-top-color:var(--bad)}.card.full{border-top-color:var(--ok)}
.top{display:flex;gap:12px;align-items:flex-start}
.top .ring{width:58px;height:58px}.top .ring i{width:44px;height:44px;font-size:13px;background:var(--p2)}
.top h3{margin:0;font-size:16px}
.date{font-weight:700;color:var(--acc)}.over .date{color:var(--bad)}
.meta{margin:10px 0;color:var(--mute);font-size:13px;display:grid;gap:2px}.meta b{color:var(--ink);font-weight:600}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:13px}
.tasks{display:grid;margin-top:6px}
.tasks label{display:flex;gap:9px;align-items:center;padding:4px 4px;border-radius:5px}
.tasks label:hover{background:var(--p)}.tasks .d{color:var(--mute);text-decoration:line-through}
.acts{display:flex;gap:8px;margin-top:10px}
textarea{font:inherit;width:100%;min-height:170px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical;margin-top:8px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.adm{display:none}body.admin .adm{display:inline-block}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--p);color:var(--ink);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:#000a}
dialog h2{font-size:17px}
dialog label.f{display:block;font-size:13px;color:var(--mute);margin-top:10px}dialog label.f input{margin-top:3px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:var(--bad);min-height:18px;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">КРД<b>.</b>ОТКРЫТИЯ</div>
  <button id="loginBtn" class="pri">Вход для админа</button>
  <span class="who" id="who"></span>
  <button id="logoutBtn" class="adm">Выйти</button>
  <div class="sp"></div>
  <div class="month"><button id="prev" aria-label="Предыдущий месяц">‹</button><span id="mlabel"></span><button id="next" aria-label="Следующий месяц">›</button></div>
</header>
<div class="wrap">
  <div class="kpi" id="kpi"></div>
  <div class="cols">
    <div class="side">
      <section>
        <div class="hd"><h2>ТО на месяц <span class="cnt" id="toCnt"></span></h2><button class="adm" id="toImp">Импорт списком</button></div>
        <div class="bar"><i id="toBar"></i></div>
        <div id="toList"></div>
        <div class="add"><input type="text" id="toName" placeholder="Название магазина"><button class="pri" id="toAdd">Добавить</button></div>
      </section>
      <section>
        <div class="hd"><h2>Этапы по всем открытиям</h2></div>
        <div id="stages"></div>
      </section>
    </div>
    <section>
      <div class="hd"><h2>Открытия магазинов</h2><div style="display:flex;gap:8px"><button class="adm" id="opImp">Импорт списком</button><button class="pri adm" id="opNew">+ Новое открытие</button></div></div>
      <div class="grid" id="opList"></div>
    </section>
  </div>
</div>

<dialog id="loginDlg">
  <h2>Вход для админа</h2>
  <label class="f">Логин<input type="text" id="lu" autocomplete="username"></label>
  <label class="f">Пароль<input type="password" id="lp" autocomplete="current-password"></label>
  <div class="err" id="lerr"></div>
  <div class="row"><button id="lcancel">Отмена</button><button class="pri" id="lgo">Войти</button></div>
</dialog>
<dialog id="opDlg">
  <h2 id="opTitle">Открытие магазина</h2>
  <label class="f">Название магазина<input type="text" id="f_name"></label>
  <label class="f">Дата открытия<input type="date" id="f_date"></label>
  <label class="f">Адрес<input type="text" id="f_addr"></label>
  <label class="f">Ответственный<input type="text" id="f_resp"></label>
  <label class="f">Кто собирает по факту (отпуск, больничный)<input type="text" id="f_fact"></label>
  <div class="row"><button id="ocancel">Отмена</button><button class="pri" id="osave">Сохранить</button></div>
</dialog>

<dialog id="impDlg">
  <h2 id="impTitle">Импорт списком</h2>
  <p class="hint" id="impHint"></p>
  <textarea id="impTxt" placeholder="Вставьте сюда список"></textarea>
  <div class="row" style="justify-content:space-between;align-items:center">
    <label class="hint" style="margin:0">Или файл .txt: <input type="file" id="impFile" accept=".txt,.csv,text/plain"></label>
  </div>
  <div class="row"><button id="impCancel">Отмена</button><button class="pri" id="impGo">Добавить</button></div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyCX2CTvfJMLdhVYIuEfY8sgPWawvaU8DYI",authDomain:"krd-tracker.firebaseapp.com",projectId:"krd-tracker",storageBucket:"krd-tracker.firebasestorage.app",messagingSenderId:"506382681336",appId:"1:506382681336:web:e093bf1daba1656685270d"});
const db=getFirestore(app),auth=getAuth(app),MAIL="@krd.ru";
const TASKS=[["maket","Подготовка макета"],["pkd","Заливка и настройка ПКД"],["server","Заливка и настройка сервера"],["rmaster","Роутер мастер"],["rreserve","Роутер резерв"],["recon","Сверка сервера"],["kkm","Регистрация ККМ"],["tbo","Регистрация ТБО"],["egais","Ключ ЕГАИС"],["uks","Сборка УКС на магазине"],["kassy","Сборка касс"],["kso","Сборка КСО"],["ap","Установка точек доступа"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
let cur=new Date();cur.setDate(1);
let admin=false,toAll=[],opAll=[],editId=null;const opened=new Set();
const ring=(p,c)=>`<div class="ring" style="--v:${p};--c:${c||"var(--ok)"}"><i>${p}%</i></div>`;
const done=x=>TASKS.filter(([k])=>(x.tasks||{})[k]).length;

function render(){
  const k=key(cur),today=new Date().toISOString().slice(0,10);
  $("mlabel").textContent=cur.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  const to=toAll.filter(x=>x.month===k).sort((a,b)=>a.done-b.done||a.name.localeCompare(b.name,"ru"));
  const op=opAll.filter(x=>(x.date||"").startsWith(k)).sort((a,b)=>a.date.localeCompare(b.date));
  const dn=to.filter(x=>x.done).length,toP=to.length?Math.round(dn/to.length*100):0;
  const ps=op.map(x=>Math.round(done(x)/TASKS.length*100));
  const avg=ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):0;
  const ready=ps.filter(p=>p===100).length,over=op.filter((x,i)=>x.date<today&&ps[i]<100).length;

  $("kpi").innerHTML=`
   <div class="k">${ring(toP)}<div><h4>ТО выполнено</h4><p>${dn} из ${to.length}</p></div></div>
   <div class="k">${ring(avg,"var(--acc)")}<div><h4>Готовность открытий</h4><p>в среднем по месяцу</p></div></div>
   <div class="k"><div class="big">${op.length}</div><div><h4>Открытий в месяце</h4><p>полностью готово: ${ready}</p></div></div>
   <div class="k"><div class="big" style="color:${over?"var(--bad)":"var(--ok)"}">${over}</div><div><h4>Просрочено</h4><p>дата прошла, этапы не закрыты</p></div></div>`;

  $("toCnt").textContent=to.length?`${toP}%`:"";
  $("toBar").style.width=toP+"%";
  $("toList").innerHTML=to.map(x=>`<div class="to ${x.done?"done":""}">
   <input type="checkbox" ${x.done?"checked":""} ${admin?"":"disabled"} data-to="${x.id}" aria-label="ТО выполнено">
   <span class="n">${esc(x.name)}</span><em>${x.done?"выполнено":"не выполнено"}</em>
   ${admin?`<button class="dng" data-delto="${x.id}" title="Убрать">✕</button>`:""}</div>`).join("")||`<div class="empty">Магазинов для ТО нет</div>`;

  $("stages").innerHTML=op.length?`<div class="st">`+TASKS.map(([kk,l])=>{
    const n=op.filter(x=>(x.tasks||{})[kk]).length,p=Math.round(n/op.length*100);
    return `<span>${l}</span><b>${n}/${op.length}</b><div class="bar"><i style="width:${p}%;${p<100?"background:var(--acc)":""}"></i></div>`}).join("")+`</div>`
    :`<div class="empty">Нет открытий в этом месяце</div>`;

  $("opList").innerHTML=op.map((x,i)=>{
    const t=x.tasks||{},p=ps[i],cls=p===100?"full":(x.date<today?"over":"");
    return `<div class="card ${cls}">
     <div class="top">${ring(p,p===100?"var(--ok)":x.date<today?"var(--bad)":"var(--acc)")}
      <div><h3>${esc(x.name)}</h3><div class="date">${new Date(x.date).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</div></div></div>
     <div class="meta"><div>${esc(x.addr)}</div><div>Ответственный: <b>${esc(x.resp)||"—"}</b></div>${x.fact?`<div>Собирает по факту: <b>${esc(x.fact)}</b></div>`:""}</div>
     <div class="bar"><i style="width:${p}%"></i></div>
     <details data-id="${x.id}" ${opened.has(x.id)?"open":""}><summary>Этапы: ${done(x)} из ${TASKS.length}</summary>
      <div class="tasks">${TASKS.map(([kk,l])=>`<label class="${t[kk]?"d":""}"><input type="checkbox" ${t[kk]?"checked":""} ${admin?"":"disabled"} data-op="${x.id}" data-k="${kk}">${l}</label>`).join("")}</div></details>
     ${admin?`<div class="acts"><button data-edit="${x.id}">Изменить</button><button class="dng" data-delop="${x.id}">Удалить</button></div>`:""}</div>`}).join("")||`<div class="empty">Открытий на этот месяц нет</div>`;
}

onSnapshot(collection(db,"to_stores"),s=>{toAll=s.docs.map(d=>({id:d.id,...d.data()}));render()});
onSnapshot(collection(db,"openings"),s=>{opAll=s.docs.map(d=>({id:d.id,...d.data()}));render()});
onAuthStateChanged(auth,u=>{admin=!!u;document.body.classList.toggle("admin",admin);$("loginBtn").style.display=admin?"none":"";$("who").textContent=u?u.email.replace(MAIL,""):"";render()});

$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$("loginBtn").onclick=()=>{$("lerr").textContent="";$("loginDlg").showModal()};
$("lcancel").onclick=()=>$("loginDlg").close();
$("lgo").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("lu").value.trim().toLowerCase()+MAIL,$("lp").value);$("lp").value="";$("loginDlg").close()}catch(e){$("lerr").textContent="Неверный логин или пароль"}};
$("lp").onkeydown=e=>{if(e.key==="Enter")$("lgo").click()};
$("logoutBtn").onclick=()=>signOut(auth);
$("toAdd").onclick=async()=>{const n=$("toName").value.trim();if(!n)return;await addDoc(collection(db,"to_stores"),{name:n,month:key(cur),done:false});$("toName").value=""};
$("toName").onkeydown=e=>{if(e.key==="Enter")$("toAdd").click()};

function openOp(x){editId=x?x.id:null;$("opTitle").textContent=x?"Изменить открытие":"Новое открытие";
  $("f_name").value=x?.name||"";$("f_date").value=x?.date||key(cur)+"-01";$("f_addr").value=x?.addr||"";$("f_resp").value=x?.resp||"";$("f_fact").value=x?.fact||"";$("opDlg").showModal()}
$("opNew").onclick=()=>openOp();
$("ocancel").onclick=()=>$("opDlg").close();
$("osave").onclick=async()=>{const d={name:$("f_name").value.trim(),date:$("f_date").value,addr:$("f_addr").value.trim(),resp:$("f_resp").value.trim(),fact:$("f_fact").value.trim()};
  if(!d.name||!d.date){alert("Укажите название и дату");return}
  if(editId)await updateDoc(doc(db,"openings",editId),d);else await addDoc(collection(db,"openings"),{...d,tasks:{}});$("opDlg").close()};

let impMode="to";
function openImp(m){impMode=m;
  $("impTitle").textContent=m==="to"?"Импорт магазинов для ТО":"Импорт открытий";
  $("impHint").textContent=m==="to"
   ?"По одному магазину в строке (можно скопировать столбец из Excel). Добавятся в выбранный месяц, повторы пропускаются."
   :"Одна строка — одно открытие. Столбцы из Excel по порядку: название, дата (25.10.2026), адрес, ответственный. Если даты нет, ставится 1 число выбранного месяца.";
  $("impTxt").value="";$("impDlg").showModal()}
$("toImp").onclick=()=>openImp("to");
$("opImp").onclick=()=>openImp("op");
$("impCancel").onclick=()=>$("impDlg").close();
$("impFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await f.arrayBuffer();
  try{$("impTxt").value=new TextDecoder("utf-8",{fatal:true}).decode(b)}catch{$("impTxt").value=new TextDecoder("windows-1251").decode(b)}e.target.value=""};
const pd=v=>{v=(v||"").trim();let m=v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:""};
$("impGo").onclick=async()=>{
  const lines=$("impTxt").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return;
  const k=key(cur);let jobs=[];
  if(impMode==="to"){const ex=new Set(toAll.filter(x=>x.month===k).map(x=>x.name.toLowerCase()));
    for(const n of lines){if(ex.has(n.toLowerCase()))continue;ex.add(n.toLowerCase());jobs.push(addDoc(collection(db,"to_stores"),{name:n,month:k,done:false}))}}
  else for(const l of lines){const c=l.split(/\t|;/).map(x=>x.trim());if(!c[0])continue;
    jobs.push(addDoc(collection(db,"openings"),{name:c[0],date:pd(c[1])||k+"-01",addr:c[2]||"",resp:c[3]||"",fact:"",tasks:{}}))}
  try{await Promise.all(jobs);$("impDlg").close();alert("Добавлено: "+jobs.length)}catch(e){alert("Ошибка записи. Проверьте, что вы вошли как админ")}};

document.addEventListener("toggle",e=>{const id=e.target.dataset?.id;if(id)e.target.open?opened.add(id):opened.delete(id)},true);
document.addEventListener("click",async e=>{const g=a=>e.target.dataset[a];
  if(g("edit"))openOp(opAll.find(x=>x.id===g("edit")));
  if(g("delop")&&confirm("Удалить открытие?"))await deleteDoc(doc(db,"openings",g("delop")));
  if(g("delto")&&confirm("Убрать магазин из списка ТО?"))await deleteDoc(doc(db,"to_stores",g("delto")))});
document.addEventListener("change",async e=>{const t=e.target;if(!admin)return;
  if(t.dataset.to)await updateDoc(doc(db,"to_stores",t.dataset.to),{done:t.checked});
  if(t.dataset.op)await updateDoc(doc(db,"openings",t.dataset.op),{["tasks."+t.dataset.k]:t.checked})});
</script>
</body>
</html>
